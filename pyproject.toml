################################################################################
# Tool Configuration
################################################################################

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docs: Tests relating to generated documentation!",
    "installs: Tests that install packages, e.g. from executing hatch env scripts",
]

# The default isort output conflicts with black autoformatting.
# Tell isort to behave nicely with black
# See https://pycqa.github.io/isort/docs/configuration/black_compatibility.html
# for more information.
[tool.isort]
profile = "black"

[tool.pydoclint]
style = "google"  # TODO: Other styles are possible here, like 'numpy'
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
exclude = "_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["raises"]

# [tool.coverage.paths]
# source = [
#     "src/<project_name",
# ]

[tool.coverage.run]
branch = true
parallel = true
# omit = [
#     "src/<project_name>/_version.py",
# ]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
precision = 2

################################################################################
# Hatch Environments
################################################################################

[tool.hatch.envs.default]
skip-install = true
installer = "uv"

[tool.hatch.envs.dev]
description = """
Describe the environment for local development.
"""
dependencies = [
    "copier ~=9.3",
]
path = ".venv"


[tool.hatch.envs.test]
description = """
Run test suite
"""
dependencies = [
    "pytest",
    "pytest-cov",
    "pytest-raises",
    "pytest-randomly",
    "pytest-xdist",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:--cov=<project_name> --cov-report=term-missing --cov-report=xml}"

[tool.hatch.envs.style]
description = """Check the style of the codebase."""
dependencies = [
    "pydoclint",
]
detached = true

[tool.hatch.envs.style.scripts]
docstrings = "pydoclint"
check = ["docstrings"]